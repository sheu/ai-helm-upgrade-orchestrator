# Kafka Connect values — vehicle-services / eu-west-1 / INT
component: kafka-connect
chart:
  repository: internal-platform
  name: kafka-connect
  version: 0.18.2
image:
  repository: confluentinc/cp-kafka-connect
  tag: 7.8.1
  pullPolicy: IfNotPresent
replicaCount: 2
kafka:
  connect:
    config.storage.replication.factor: "3"
    offset.storage.replication.factor: "3"
    status.storage.replication.factor: "3"
    group.id: vehicles-euw1-int-connect
bootstrapServers: "kafka-broker-int.eu-west-1.internal:9092"
schemaRegistryUrl: "http://schema-registry-int.eu-west-1.internal:8081"
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"
