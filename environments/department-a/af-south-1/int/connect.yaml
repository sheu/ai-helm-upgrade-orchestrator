# Kafka Connect values — payments / af-south-1 / INT (older version, K8s 1.30)
component: kafka-connect
chart:
  repository: internal-platform
  name: kafka-connect
  version: 0.17.5
image:
  repository: confluentinc/cp-kafka-connect
  tag: 7.7.3
  pullPolicy: IfNotPresent
replicaCount: 2
kafka:
  connect:
    config.storage.replication.factor: "3"
    offset.storage.replication.factor: "3"
    status.storage.replication.factor: "3"
    group.id: payments-afs-int-connect
bootstrapServers: "kafka-broker-int.af-south-1.internal:9092"
schemaRegistryUrl: "http://schema-registry-int.af-south-1.internal:8081"
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"
